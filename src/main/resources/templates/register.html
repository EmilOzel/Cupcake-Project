<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Opret konto</title>
    <link rel="stylesheet" href="/public/css/styles.css" />
</head>
<body>
<p th:if="${demoMode}" style="text-align:center;padding:10px;margin:0;background:#f8e5ee;color:#4c2637;">Studieprojekt · Demobutik med fiktive køb. Nye konti får 100 demokroner.</p>

<nav>
    <a href="/" style="display: block; line-height: 0; border: none;">
        <img src="/public/images/olskerlogo.png" alt="Olsker Cupcakes" style="height: 60px; display: block;" />
    </a>
    <div>
        <a class="nav-btn" href="/login">Log ind</a>
    </div>
</nav>

<div class="center">
    <div class="card">
        <h2>Opret konto</h2>
        <p class="error" th:if="${error}" th:text="${error}"></p>
        <form action="/register" method="post">
            <label>Email</label>
            <input type="email" name="email" placeholder="din@email.dk" required />
            <label>Adgangskode</label>
            <input type="password" name="password" placeholder="••••••••" required />
            <button type="submit">Opret konto</button>
        </form>
        <div class="register-link">
            Har du allerede en konto? <a href="/login">Log ind</a>
        </div>
    </div>
</div>

</body>
</html>
